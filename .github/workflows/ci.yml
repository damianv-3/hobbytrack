name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Install & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hobbytrack-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hobbytrack-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node -c server.js

  frontend:
    name: Frontend - Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hobbytrack-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hobbytrack-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hobbytrack-backend ./hobbytrack-backend

      - name: Build frontend image
        run: docker build -t hobbytrack-frontend ./hobbytrack-frontend